<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    km 工作台的分頁圖示。

    **自帶底色**（不是透明背景的線條圖）：分頁列在淺色與深色主題下都有，
    透明背景的單色圖會在其中一種底下消失。

    **底色刻意不跟 app 的任何一個色票綁**（曾經是側邊欄的 #2d2d2d）——
    它的工作是「在一排分頁裡一眼認出來」，而 Jay 常開的那幾個站
    （Jira 藍、GitHub 黑、Play Console 藍、POEditor 藍綠）佔掉了
    藍與黑，所以走暖沙 + 深棕這組沒人用的。

    沙色比 #f5e6d3 再深一階，是因為淺色分頁列本身就接近米白，
    太淺的方塊會整個溶進去，只剩下一個浮空的 K。

    16px 下只認得出「形狀 + 一個字母」，所以放 K 而不是 KM —— 兩個字母
    在 16px 會糊成一團。
  -->
  <rect width="32" height="32" rx="7" fill="#efd9b8"/>
  <path d="M11 8v16M11 16l8-8M13.5 13.5 20 24"
        fill="none" stroke="#7c2d12" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
